<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>User Management - FastAPI RBAC</title>
    <!-- CoreUI CSS -->
    <link rel="stylesheet" href="vendors/simplebar/css/simplebar.css">
    <link rel="stylesheet" href="css/vendors/simplebar.css">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/examples.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script src="js/color-modes.js"></script>
  </head>
  <body>
    <div id="sidebar-placeholder"></div>
    <div class="wrapper d-flex flex-column min-vh-100 bg-light">
      <div id="header-placeholder"></div>
      <div class="body flex-grow-1 px-3">
        <div class="container-lg">
          <h1>User Management</h1>
          <button type="button" class="btn btn-primary mb-3" data-coreui-toggle="modal" data-coreui-target="#createUserModal">
            Create New User
          </button>

          <!-- Create User Modal -->
          <div class="modal fade" id="createUserModal" tabindex="-1" aria-labelledby="createUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="createUserModalLabel">Create New User</h5>
                  <button type="button" class="btn-close" data-coreui-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <form id="createUserForm">
                    <div class="mb-3">
                      <label for="newUsername" class="form-label">Username</label>
                      <input type="text" class="form-control" id="newUsername" required>
                    </div>
                    <div class="mb-3">
                      <label for="newPassword" class="form-label">Password</label>
                      <input type="password" class="form-control" id="newPassword" required>
                    </div>
                    <div class="mb-3">
                      <label for="newRole" class="form-label">Role</label>
                      <select class="form-select" id="newRole" required>
                        <!-- Roles will be loaded here by JavaScript -->
                      </select>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Additional Permissions (Overrides)</label>
                      <div id="permissionsChecklist" class="form-check-group"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create User</button>
                  </form>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-header">User List</div>
            <div class="card-body">
              <table class="table table-bordered">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="userTableBody">
                  <!-- User rows will be inserted here by JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div id="footer-placeholder"></div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
            <button type="button" class="btn-close" data-coreui-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editUserForm">
              <input type="hidden" id="editUserId">
              <div class="mb-3">
                <label for="editUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="editUsername" required>
              </div>
              <div class="mb-3">
                <label for="editPassword" class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" class="form-control" id="editPassword">
              </div>
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="editIsActive">
                <label class="form-check-label" for="editIsActive">Is Active</label>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-coreui-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" id="saveUserChanges">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- CoreUI and necessary plugins-->
    <script src="vendors/@coreui/coreui/js/coreui.bundle.min.js"></script>
    <script src="vendors/simplebar/js/simplebar.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/color-modes.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/template_loader.js"></script>
    <script src="assets/js/users.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        loadTemplate('sidebar-placeholder', '_sidebar.html');
        loadTemplate('header-placeholder', '_header.html');
        loadTemplate('footer-placeholder', '_footer.html');
      });
    </script>
  </body>
</html>
